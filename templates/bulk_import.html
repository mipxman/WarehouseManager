{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>📦 Bulk Serial Number Import</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">
        Upload a <strong>.txt, .csv,</strong> or <strong>.xlsx</strong> file containing serial numbers. The system will parse all serials automatically.
    </p>

    <form method="POST" enctype="multipart/form-data">
        <label><strong>Action Type:</strong></label>
        <select name="action" disabled style="background:#e9ecef;">
            <option value="ENTRANCE">ENTRANCE (Bulk Stock In)</option>
        </select>

        <label><strong>Select Serial List File (.txt, .csv, .xlsx):</strong></label>
        <input type="file" name="file" accept=".txt,.csv,.xlsx,.xls" required style="background:#f8f9fa; padding:8px; border:1px solid #ccc; border-radius:4px; margin-bottom:12px; width:100%; box-sizing:border-box;">

        <!-- Order Factor / Invoice Attachment Input -->
        <label><strong>📎 Order Factor / Invoice / Item Photo (PDF, JPG, PNG):</strong></label>
        <input type="file" name="attachment" accept=".pdf,image/*" style="background:#f8f9fa; padding:8px; border:1px solid #ccc; border-radius:4px; margin-bottom:12px; width:100%; box-sizing:border-box;">

        <label><strong>Category / Model (Optional - Auto-detects if left blank):</strong></label>
        <select name="category_id">
            <option value="">-- Select Category / Model --</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.vendor }} {{ cat.name }} ({{ cat.model }})</option>
            {% endfor %}
        </select>

        <label><strong>Assign to Client / Property (Optional):</strong></label>
        <select name="property_id">
            <option value="">-- Unassigned / Company Stock --</option>
            {% for prop in properties %}
            <option value="{{ prop.id }}">{{ prop.name }}</option>
            {% endfor %}
        </select>

        <label><strong>Batch Comment / Note:</strong></label>
        <textarea name="comment" rows="2" placeholder="e.g. Packing slip ID 2891813 / Order POIT010063624"></textarea>

        <button type="submit" style="background:#28a745; color:#fff; border:none; padding:12px; width:100%; border-radius:6px; font-weight:bold; font-size:16px; margin-top:15px; cursor:pointer;">
            Upload & Process Bulk Serials
        </button>
    </form>
</div>
{% endblock %}
